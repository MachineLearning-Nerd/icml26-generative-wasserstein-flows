[project]
name = "gwf-reproduction"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
  "marimo==0.14.17",
  "matplotlib==3.10.3",
  "numpy==2.1.3",
  "pytorch-fid==0.3.0",
  "scipy==1.15.3",
  "sympy==1.13.1",
  "torch==2.5.1",
  "torchvision==0.20.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.uv]
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
